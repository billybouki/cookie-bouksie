<!doctype html>
<html lang="en" data-palette="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works — Bouksi</title>
<script>(function(){try{var p=localStorage.getItem('bouksi-palette');if(p)document.documentElement.setAttribute('data-palette',p);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-logo">[bouksi<span class="blink">_</span>]</a>
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="works.html" aria-current="page">Works</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
  </nav>
</header>

<div class="palette-switcher-row">
  <div class="palette-switcher" role="group" aria-label="Colour palette">
    <button type="button" data-palette="cream" class="palette-swatch-cream" aria-pressed="true" aria-label="Cream palette"></button>
    <button type="button" data-palette="sky" class="palette-swatch-sky" aria-pressed="false" aria-label="Sky palette"></button>
    <button type="button" data-palette="mustard" class="palette-swatch-mustard" aria-pressed="false" aria-label="Mustard palette"></button>
    <button type="button" data-palette="teal" class="palette-swatch-teal" aria-pressed="false" aria-label="Teal palette"></button>
    <button type="button" data-palette="rose" class="palette-swatch-rose" aria-pressed="false" aria-label="Rose palette"></button>
    <button type="button" data-palette="ink" class="palette-swatch-ink" aria-pressed="false" aria-label="Ink palette"></button>
  </div>
</div>

<main>
  <section class="section">
    <h1>Works</h1>

    <div class="category-filter" role="group" aria-label="Filter by category">
      <button type="button" data-category="all" aria-pressed="true">All</button>
      <button type="button" data-category="projections" aria-pressed="false">Projections</button>
      <button type="button" data-category="machines" aria-pressed="false">Machines</button>
      <button type="button" data-category="3d-motion" aria-pressed="false">3D Graphics &amp; Motion Design</button>
      <button type="button" data-category="interactives-games" aria-pressed="false">Interactives &amp; Games</button>
      <button type="button" data-category="products-commercial" aria-pressed="false">Products &amp; Commercial</button>
      <button type="button" data-category="realities" aria-pressed="false">Realities</button>
      <button type="button" data-category="other" aria-pressed="false">Other</button>
    </div>

    <!--
      Add one .project-card per project as content is ready.
      data-category must match one of the filter button values above.
    -->
    <div class="project-grid">

      <a class="project-card" href="projects/poseidons-island.html" data-category="3d-motion">
        <div class="project-card-media">
          <img src="assets/images/poseidons-island/cover.jpg" alt="Still from Poseidon's Island">
        </div>
        <div class="project-card-body">
          <span class="tag">3D Graphics &amp; Motion Design</span>
          <h3>Poseidon's Island</h3>
        </div>
      </a>

      <a class="project-card" href="projects/komprai.html" data-category="realities">
        <div class="project-card-media">
          <img src="assets/images/komprai/cover.jpg" alt="Still from Komprai">
        </div>
        <div class="project-card-body">
          <span class="tag">Realities</span>
          <h3>Komprai</h3>
        </div>
      </a>

      <a class="project-card" href="projects/ermafa.html" data-category="machines">
        <div class="project-card-media">
          <img src="assets/images/ermafa/cover.jpg" alt="Still from Ermafa">
        </div>
        <div class="project-card-body">
          <span class="tag">Machines</span>
          <h3>Ermafa</h3>
        </div>
      </a>

      <a class="project-card" href="projects/vhf.html" data-category="interactives-games">
        <div class="project-card-media">
          <img src="assets/images/vhf/cover.jpg" alt="Still from VHF">
        </div>
        <div class="project-card-body">
          <span class="tag">Interactives &amp; Games</span>
          <h3>VHF</h3>
        </div>
      </a>

      <a class="project-card" href="projects/ai-drawer.html" data-category="products-commercial">
        <div class="project-card-media">
          <img src="assets/images/ai-drawer/cover.jpg" alt="Still from AI Drawer">
        </div>
        <div class="project-card-body">
          <span class="tag">Products &amp; Commercial</span>
          <h3>AI Drawer</h3>
        </div>
      </a>

      <a class="project-card" href="projects/edition-of-one.html" data-category="interactives-games">
        <div class="project-card-media">
          <img src="assets/images/edition-of-one/cover.jpg" alt="Still from Edition of One">
        </div>
        <div class="project-card-body">
          <span class="tag">Interactives &amp; Games</span>
          <h3>Edition of One</h3>
        </div>
      </a>

      <!-- TODO: Converse, Milano, AI Photobooth, Pinball, Screamers -->

    </div>
  </section>
</main>

<footer class="site-footer">
  <span>&copy; 2026 Billy Bouksi</span>
  <!-- TODO: replace with real email / social link -->
  <a href="#">Get in touch</a>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>

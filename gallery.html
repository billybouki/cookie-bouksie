<!doctype html>
<html lang="en" data-palette="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Bouksi</title>
<script>(function(){try{var p=localStorage.getItem('bouksi-palette');if(p)document.documentElement.setAttribute('data-palette',p);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-logo">[bouksi<span class="blink">_</span>]</a>
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="works.html">Works</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
    <a href="about.html">About</a>
  </nav>
</header>

<div class="palette-switcher-row">
  <div class="palette-switcher" role="group" aria-label="Colour palette">
    <button type="button" data-palette="cream" class="palette-swatch-cream" aria-pressed="true" aria-label="Cream palette"></button>
    <button type="button" data-palette="sky" class="palette-swatch-sky" aria-pressed="false" aria-label="Sky palette"></button>
    <button type="button" data-palette="mustard" class="palette-swatch-mustard" aria-pressed="false" aria-label="Mustard palette"></button>
    <button type="button" data-palette="teal" class="palette-swatch-teal" aria-pressed="false" aria-label="Teal palette"></button>
    <button type="button" data-palette="rose" class="palette-swatch-rose" aria-pressed="false" aria-label="Rose palette"></button>
    <button type="button" data-palette="ink" class="palette-swatch-ink" aria-pressed="false" aria-label="Ink palette"></button>
    <button type="button" data-palette="plum" class="palette-swatch-plum" aria-pressed="false" aria-label="Plum palette"></button>
  </div>
</div>

<main>
  <section class="section">
    <h1>Gallery</h1>
    <p>Stills and clips from across projects.</p>

    <!--
      Media list lives in assets/js/gallery-media.js (generated by
      `npm run build:gallery` from everything under assets/images/ and
      assets/video/ — see scripts/build-gallery-manifest.js). main.js
      shuffles it client-side and renders it here in batches.
    -->
    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="gallery-load-more-row">
      <button type="button" id="gallery-load-more" class="btn">Load more</button>
    </p>
  </section>
</main>

<footer class="site-footer">
  <span>&copy; 2026 BILLYBOUKI</span>
  <a href="about.html">Get in touch</a>
</footer>

<script src="assets/js/gallery-media.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
